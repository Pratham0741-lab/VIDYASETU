[project]
name = "vidyasetu-ml"
version = "0.1.0"
description = "VIDYASETU ML & Document Processing Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.2.0",
    "jellyfish>=1.0.0",
    "rapidfuzz>=3.6.0",
    "pytesseract>=0.3.10",
    # Phase 13E: PDF page rasterisation (bundled PDFium; installed at build time, no runtime network).
    "pypdfium2>=4.30.0",
    "httpx>=0.27.0",
    # Primary OCR engine (PP-OCRv5 mobile models, baked into the image at build time).
    "paddlepaddle==3.2.2",
    "paddleocr==3.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = [".", "ml"]
asyncio_mode = "auto"
